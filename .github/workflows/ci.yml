# Ostomate 2.0 CI.
# Cost rule (ostomate-2.0/07-business-plan.md): macOS runners bill at 10×.
# Phase 2.5.1: all 69 shared tests (incl. Room DAO + migrations, via Robolectric)
# run in the ubuntu `android` job, so every PR gates them at no macOS cost. The
# macOS `ios` job additionally validates the unsigned iOS build + the real native
# SQLite path, but only on PRs that touch iOS/DB/build files (see `detect-changes`).
# E2E (Maestro) still runs on main merges and manual dispatch only — emulator start-up is slow.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly heartbeat so the testpulse dashboard can tell a quiet repo from a broken
    # one: it flags a project stale when no report arrives for 8 days, and a week with
    # no push would otherwise look identical to a pipeline that stopped reporting.
    # Sunday 06:17 UTC — off the top of the hour, where GitHub's scheduler is least
    # contended, and outside the weekday windows the E2E jobs usually occupy.
    - cron: '17 6 * * 0'

jobs:
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        # code: false when every changed file is docs (docs/, planning/, any *.md), and every
        # other job then skips. Jobs are skipped rather than the workflow filtered with
        # paths-ignore on purpose: a filtered PR shows *no checks*, which is exactly how 11
        # days of dead CI went unnoticed (PR #15). A skipped job shows up as skipped.
        # The weekly schedule and manual dispatch always run everything.
        #
        # ios: non-PR events (main push, manual dispatch) always validate iOS. On PRs,
        # only when files that can break the iOS build or the native SQLite path
        # (Room DAO + migrations live in shared/.../data/db) change.
        run: |
          case "${{ github.event_name }}" in
            pull_request) base="${{ github.event.pull_request.base.sha }}" ;;
            push) base="${{ github.event.before }}" ;;
            *) base="" ;;
          esac
          # No usable base (schedule, dispatch, or a push that created the branch): run it all.
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "ios=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "$base" "${{ github.sha }}")
          echo "Changed files:"; echo "$changed"
          # List the non-docs files and test for none, rather than `! grep -qv`: that form
          # depends on grep's -q/-v interplay, which not every grep gets right.
          code_files=$(echo "$changed" | grep -vE '^(docs/|planning/)|\.md$' || true)
          if [ -n "$changed" ] && [ -z "$code_files" ]; then
            echo "Docs-only change: skipping build, tests and E2E."
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "ios=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if echo "$changed" | grep -qE \
            '^(iosApp/|composeApp/src/iosMain/|shared/src/ios|shared/src/commonMain/kotlin/com/ostomate/app/data/db/|shared/schemas/|.*\.gradle\.kts$|gradle/libs\.versions\.toml$)'; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
          else
            echo "ios=false" >> "$GITHUB_OUTPUT"
          fi

  android:
    name: Android build + JVM tests
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.code == 'true'
    env:
      # Job-level so the Codecov step's `if` can see it — the secrets context
      # itself is not allowed in step `if` expressions (invalidates the workflow).
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: ktlint check
        run: ./gradlew :shared:ktlintCheck :composeApp:ktlintCheck :androidApp:ktlintCheck --stacktrace
      - name: detekt
        run: ./gradlew :shared:detektMetadataCommonMain :composeApp:detektMetadataCommonMain :androidApp:detekt --stacktrace
      - name: Build debug APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace
      - name: Run JVM host tests with coverage
        # !cancelled(): run even when ktlint, detekt or the APK build above failed. Without a
        # status function the step is implicitly success(), so a lint failure skipped every
        # test and testpulse got a report with no results (reporting standard v1, rule 2.4).
        # The job still fails on the lint step.
        if: ${{ !cancelled() }}
        # jacocoCoverageVerification fails the build if line coverage drops below the
        # floors in shared/build.gradle.kts (domain + data) and composeApp/build.gradle.kts
        # (ViewModel + UiState). :composeApp:testAndroidHostTest also verifies the Roborazzi
        # screenshot baselines in composeApp/screenshots/ (2.5.7) — a layout change fails here.
        # --continue so a shared failure still runs composeApp's tests (and its testpulse
        # report); the build still fails at the end, and a task whose test task failed is
        # skipped, not passed. :shared:pitestDomain fails below 95% mutation score on the
        # domain layer (2.5.9); it reuses this invocation's test run, so it costs seconds.
        run: >
          ./gradlew
          :shared:testAndroidHostTest :shared:jacocoHostTestReport :shared:jacocoCoverageVerification
          :composeApp:testAndroidHostTest :composeApp:jacocoHostTestReport :composeApp:jacocoCoverageVerification
          :shared:pitestDomain
          --continue --stacktrace
      - name: Upload screenshot diffs
        # Only produced when a baseline mismatched: <name>_compare.png is a
        # reference | diff | new triptych, <name>_actual.png is the new render. Download this
        # artifact to see what moved; re-record with -Pscreenshot.record if the change is wanted.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-diffs
          path: composeApp/build/outputs/roborazzi/
          if-no-files-found: ignore
      - name: Publish coverage summary
        if: always()
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          reports = [
              ("shared (domain + data)", "shared/build/reports/jacoco/jacocoHostTestReport/jacocoHostTestReport.xml"),
              ("composeApp (ViewModel + UiState)", "composeApp/build/reports/jacoco/jacocoHostTestReport/jacocoHostTestReport.xml"),
          ]
          print("## Coverage\n")
          for title, path in reports:
              try:
                  root = ET.parse(path).getroot()
              except FileNotFoundError:
                  print(f"**{title}** — _no report produced (tests failed before JaCoCo ran)._\n")
                  continue
              print(f"### {title}\n")
              print("| Counter | Covered | % |")
              print("|---|---|---|")
              for c in root.findall("counter"):
                  missed, covered = int(c.get("missed")), int(c.get("covered"))
                  total = missed + covered
                  print(f"| {c.get('type').title()} | {covered}/{total} | {100 * covered / total:.1f}% |")
              print("\n| Package | Line % |")
              print("|---|---|")
              for p in root.findall("package"):
                  for c in p.findall("counter"):
                      if c.get("type") == "LINE":
                          missed, covered = int(c.get("missed")), int(c.get("covered"))
                          print(f"| {p.get('name').replace('com/ostomate/app/', '')} | {100 * covered / (missed + covered):.1f}% |")
              print()
          EOF
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            shared/build/reports/jacoco/jacocoHostTestReport/
            composeApp/build/reports/jacoco/jacocoHostTestReport/
          if-no-files-found: ignore
      - name: Upload mutation report
        # mutations.xml / index.html list every surviving mutant: the starting point when
        # :shared:pitestDomain fails the threshold.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: shared/build/reports/pitest/
          if-no-files-found: ignore
      - name: Upload coverage to Codecov
        # Approved in 08-test-strategy §6 (free — public repo). Inert until the
        # CODECOV_TOKEN secret is added under Settings → Secrets → Actions.
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v5
        continue-on-error: true
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: >-
            shared/build/reports/jacoco/jacocoHostTestReport/jacocoHostTestReport.xml,
            composeApp/build/reports/jacoco/jacocoHostTestReport/jacocoHostTestReport.xml
      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results-jvm
          path: |
            shared/build/test-results/testAndroidHostTest/TEST-*.xml
            composeApp/build/test-results/testAndroidHostTest/TEST-*.xml
          if-no-files-found: ignore
      - name: Report android/shared/jvm to testpulse
        # Publishes the JUnit XML + JaCoCo XML to the public testpulse dashboard. The action never
        # fails the build: a missing secret (fork PR), an HTTP error or no matching files is a
        # warning plus a job-summary line. `always()` so a failing suite still gets reported — a red
        # run is exactly the data the dashboard exists to show. job/module/platform are test
        # identity and history in testpulse (standard section 4): never rename them casually.
        if: always()
        uses: bhelco1/testpulse/.github/actions/report@v1
        with:
          job: android
          module: shared
          platform: jvm
          format: junit
          results: "shared/build/test-results/testAndroidHostTest/TEST-*.xml"
          coverage-format: jacoco
          coverage-file: shared/build/reports/jacoco/jacocoHostTestReport/jacocoHostTestReport.xml
          url: ${{ vars.TESTPULSE_URL }}
          token: ${{ secrets.TESTPULSE_TOKEN }}
      - name: Report android/composeApp/jvm to testpulse
        if: always()
        uses: bhelco1/testpulse/.github/actions/report@v1
        with:
          job: android
          module: composeApp
          platform: jvm
          format: junit
          results: "composeApp/build/test-results/testAndroidHostTest/TEST-*.xml"
          coverage-format: jacoco
          coverage-file: composeApp/build/reports/jacoco/jacocoHostTestReport/jacocoHostTestReport.xml
          url: ${{ vars.TESTPULSE_URL }}
          token: ${{ secrets.TESTPULSE_TOKEN }}
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: androidApp-debug
          path: androidApp/build/outputs/apk/debug/*.apk

  build-release:
    name: Android release AAB (signed)
    runs-on: ubuntu-latest
    # Merges and manual dispatch only: the AAB is what gets uploaded to Play, and a PR build
    # of it would put the signing secrets within reach of PR code for no gain.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.detect-changes.outputs.code == 'true'
    needs: [detect-changes, android]
    env:
      # Job-level for the same reason as CODECOV_TOKEN: step `if`s cannot read `secrets`.
      KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
    steps:
      - name: Check signing secrets
        id: secrets
        # Until the upload key is added (planning/05-dev-plan.md 3.1) there is nothing to sign
        # with. Say so in the run summary rather than fail main or upload an unsigned AAB
        # that looks like a release.
        run: |
          if [ -n "$KEYSTORE_FILE" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Release AAB not built: KEYSTORE_FILE secret is not set."
            echo "**Release AAB not built** — signing secrets are not set (dev plan 3.1)." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.present == 'true'
      - uses: actions/setup-java@v4
        if: steps.secrets.outputs.present == 'true'
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        if: steps.secrets.outputs.present == 'true'
      - name: Build signed release AAB
        if: steps.secrets.outputs.present == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        # An empty DSN builds fine and ships an app whose opt-in crash reporting silently
        # does nothing, so refuse to build a release without one.
        run: |
          [ -n "$SENTRY_DSN" ] || { echo "::error::SENTRY_DSN secret is empty"; exit 1; }
          export KEYSTORE_PATH="$RUNNER_TEMP/upload.jks"
          echo "$KEYSTORE_FILE" | base64 --decode > "$KEYSTORE_PATH"
          ./gradlew :androidApp:bundleRelease -PSENTRY_DSN="$SENTRY_DSN" --stacktrace
          rm -f "$KEYSTORE_PATH"
      - name: Verify AAB signature
        if: steps.secrets.outputs.present == 'true'
        # jarsigner exits 0 on an unsigned file ("jar is unsigned"), so check what it says.
        run: |
          out=$(jarsigner -verify androidApp/build/outputs/bundle/release/androidApp-release.aab)
          echo "$out"
          echo "$out" | grep -q "^jar verified" || { echo "::error::AAB is not signed"; exit 1; }
      - name: Upload release AAB
        if: steps.secrets.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: androidApp-release
          path: androidApp/build/outputs/bundle/release/androidApp-release.aab
          if-no-files-found: error

  android-e2e:
    name: Android E2E (Maestro)
    runs-on: ubuntu-latest
    # A normal run takes ~8 min. Without a cap a hung emulator or Maestro holds the runner
    # for GitHub's 6-hour default.
    timeout-minutes: 45
    # Merges and manual dispatch only — spelled out as `push || workflow_dispatch`
    # rather than `!= 'pull_request'` so the weekly `schedule` does not drag the E2E
    # suites in with it. That schedule exists solely so the testpulse dashboard can tell
    # a quiet repo from a broken one; it needs the JVM/simulator reports, not an emulator
    # and a macOS runner every Sunday (macOS bills at 10x — see the cost rule up top).
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace
      - name: Install Maestro
        # Pinned: the installer defaults to latest, so a new Maestro release can change
        # the flow schema and break the suite with no commit of ours. 2.x turned unknown
        # properties into hard errors, which is how `timeout:` on assertVisible silently
        # rotted every flow. Bump deliberately, not by drift.
        env:
          MAESTRO_VERSION: 2.11.0
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /usr/local/lib/android/sdk/build-tools/29.0.3
          sudo rm -rf /usr/local/lib/android/sdk/build-tools/30.0.3
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /opt/hostedtoolcache/go
          sudo rm -rf /opt/hostedtoolcache/Ruby
          df -h
      - name: Enable KVM (required for Android emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Maestro E2E flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          # -no-window + swiftshader_indirect are required on a headless runner: without
          # them the emulator waits on a display that never appears and boot times out.
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
            -camera-back none -camera-front none
          boot-timeout: 900
          script: |
            adb start-server
            adb wait-for-device
            until adb shell getprop sys.boot_completed 2>/dev/null | grep -q '1'; do sleep 3; done
            adb install androidApp/build/outputs/apk/debug/androidApp-debug.apk
            bash scripts/run_android_e2e.sh
      - name: Report android-e2e/e2e/android-emulator to testpulse
        # One JUnit file per flow, written by scripts/run_android_e2e.sh. `always()` so a red
        # E2E run is reported too — it used to reach no dashboard at all.
        if: always()
        uses: bhelco1/testpulse/.github/actions/report@v1
        with:
          job: android-e2e
          module: e2e
          platform: android-emulator
          format: junit
          results: "e2e-results/*.xml"
          url: ${{ vars.TESTPULSE_URL }}
          token: ${{ secrets.TESTPULSE_TOKEN }}
      - name: Upload E2E JUnit results
        # Kept for the testpulse parser's fixtures (captured files only, never hand-written).
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-junit-android
          path: e2e-results/*.xml
          if-no-files-found: warn
          retention-days: 30
      - name: Upload E2E failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics
          # Workspace-relative on purpose: the previous attempt pointed at maestro-debug/
          # and ~/.maestro/tests/ and got "No files were found" for both, so every
          # "element not found" so far has been reasoned about rather than looked at.
          path: e2e-diagnostics/
          if-no-files-found: warn

  ios:
    name: iOS shared tests + app build
    # Apple-Silicon runner: validates the unsigned iOS build and runs the arm64 simulator
    # tests against the REAL bundled native driver (the ubuntu `android` job already gates
    # all 69 on the JVM via Robolectric). PRs only when iOS/DB-layer files changed
    # (see detect-changes), else main only.
    runs-on: macos-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.code == 'true' && needs.detect-changes.outputs.ios == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        # Runner default (16.4) is too old for CMP 1.11 — its framework references
        # newer UIKit symbols (e.g. UIViewLayoutRegion) and the app link fails.
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -n1)"
          xcodebuild -version
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: SwiftLint
        run: swiftlint lint --config iosApp/.swiftlint.yml --strict iosApp/
      - name: Shared + ViewModel tests on iOS simulator (arm64)
        # !cancelled(): run even when SwiftLint above failed, as in the android job.
        if: ${{ !cancelled() }}
        # --continue: a failing shared test must not stop composeApp's tests from running,
        # or composeApp's testpulse report goes missing on exactly the red runs. Gradle still
        # fails the build once the remaining tasks finish.
        run: ./gradlew :shared:iosSimulatorArm64Test :composeApp:iosSimulatorArm64Test --continue --stacktrace
      - name: Report ios/shared/ios-sim to testpulse
        # Same action as the `android` job; no coverage because JaCoCo is JVM-only and the
        # simulator run produces none. Cannot fail the build.
        if: always()
        uses: bhelco1/testpulse/.github/actions/report@v1
        with:
          job: ios
          module: shared
          platform: ios-sim
          format: junit
          results: "shared/build/test-results/iosSimulatorArm64Test/TEST-*.xml"
          url: ${{ vars.TESTPULSE_URL }}
          token: ${{ secrets.TESTPULSE_TOKEN }}
      - name: Report ios/composeApp/ios-sim to testpulse
        if: always()
        uses: bhelco1/testpulse/.github/actions/report@v1
        with:
          job: ios
          module: composeApp
          platform: ios-sim
          format: junit
          results: "composeApp/build/test-results/iosSimulatorArm64Test/TEST-*.xml"
          url: ${{ vars.TESTPULSE_URL }}
          token: ${{ secrets.TESTPULSE_TOKEN }}
      - name: Build iOS app (simulator, unsigned)
        # ARCHS=arm64 because composeApp publishes no x86_64 slice (CMP 1.11+ dropped it);
        # an unconstrained simulator build tries both archs and fails.
        run: |
          cd iosApp
          xcodebuild -project iosApp.xcodeproj -target iosApp -configuration Debug \
            -sdk iphonesimulator ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO build

  ios-e2e:
    name: iOS E2E (Maestro)
    runs-on: macos-latest
    # A normal run takes ~20-25 min. Run 36661054658 hung in the Maestro step for over an
    # hour; the 6-hour default would bill that at the macOS 10x rate.
    timeout-minutes: 45
    # Post-merge / manual dispatch only, same as android-e2e (and excluded from the
    # weekly schedule for the same reason): macOS runners are slow and bill at 10x on
    # private repos — free here, but the wall-clock cost is real.
    needs: detect-changes
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.detect-changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        # Same reason as the `ios` job: the runner default is too old for CMP 1.11.
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -n1)"
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Maestro
        # Pinned for the same reason as android-e2e — keep the two in lockstep.
        env:
          MAESTRO_VERSION: 2.11.0
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version
      - name: Build iOS app for the simulator
        # -scheme (not -target) so the product lands in a predictable -derivedDataPath.
        # ARCHS=arm64: composeApp publishes no x86_64 slice (CMP 1.11+ dropped it).
        run: |
          cd iosApp
          xcodebuild -project iosApp.xcodeproj -scheme iosApp -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath "$RUNNER_TEMP/dd" build
      - name: Boot a clean simulator
        # A *freshly created* device matters. Booting a pre-existing simulator can raise
        # a stray SpringBoard alert ("Allow widgets from Maps to use your location?") that
        # sits on top of the app — Maestro then sees only the alert and every flow fails.
        # A new device from `simctl create` has no such state.
        run: |
          read -r RUNTIME DEVTYPE < <(python3 scripts/pick_ios_simulator.py)
          echo "runtime=$RUNTIME device-type=$DEVTYPE"
          UDID=$(xcrun simctl create maestro-ios "$DEVTYPE" "$RUNTIME")
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
      - name: Install app on the simulator
        run: |
          xcrun simctl install "$SIM_UDID" \
            "$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/Ostomate.app"
      - name: Run Maestro E2E flows (iOS)
        # Covers the clusters where real device bugs appeared: onboarding, log a change,
        # deep link, backup/share. `.maestro/ios/` holds the iOS variants — the Android
        # flows they mirror stay untouched. 08 is platform-neutral and is reused as-is.
        #
        # Why variants at all: on iOS Maestro full-string-matches `text:` against the
        # accessibility tree, so the Android flows' `text: "logged"` never matches the
        # "Bag logged · 0 left" snackbar; and their Android-only bits (`pressKey: BACK`,
        # `launchApp.arguments.url`) are no-ops here.
        env:
          # The XCUITest driver never came up on the runner and the job died before a single
          # step ran ("iOS driver not ready in time" / IOSDriverTimeoutException). The default
          # startup timeout is fine on a warm local M1 and not on a cold macOS runner.
          MAESTRO_DRIVER_STARTUP_TIMEOUT: 300000
        run: |
          # Run every flow even after one fails, so a red run names ALL the broken flows
          # rather than only the first — same reason as scripts/run_android_e2e.sh.
          fail=0
          mkdir -p e2e-results
          for flow in \
            .maestro/ios/00_ios_onboarding.yaml \
            .maestro/ios/01_ios_deep_link_log.yaml \
            .maestro/ios/02_ios_log_and_undo.yaml \
            .maestro/ios/05_ios_backup_share.yaml \
            .maestro/08_biometric_gate.yaml; do
            echo "::group::maestro (iOS) $flow"
            if maestro test --device "$SIM_UDID" \
              --format junit --output "e2e-results/$(basename "$flow" .yaml).xml" "$flow"; then
              echo "PASS  $flow" >> /tmp/ios_e2e_summary
            else
              echo "FAIL  $flow" >> /tmp/ios_e2e_summary
              fail=1
            fi
            echo "::endgroup::"
          done
          echo "===== iOS E2E SUMMARY ====="
          cat /tmp/ios_e2e_summary
          echo "=========================="
          exit $fail
      - name: Report ios-e2e/e2e/ios-sim to testpulse
        if: always()
        uses: bhelco1/testpulse/.github/actions/report@v1
        with:
          job: ios-e2e
          module: e2e
          platform: ios-sim
          format: junit
          results: "e2e-results/*.xml"
          url: ${{ vars.TESTPULSE_URL }}
          token: ${{ secrets.TESTPULSE_TOKEN }}
      - name: Upload E2E JUnit results
        # Kept for the testpulse parser's fixtures (captured files only, never hand-written).
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-junit-ios
          path: e2e-results/*.xml
          if-no-files-found: warn
          retention-days: 30
      - name: Collect Maestro debug output
        # Maestro writes logs + screenshots under $HOME; upload-artifact does not expand
        # `~`/`$HOME` in `path`, so stage them inside the workspace first.
        # cancelled() too: a job stopped by timeout-minutes is cancelled, not failed.
        if: failure() || cancelled()
        run: |
          mkdir -p maestro-debug
          cp -R "$HOME/.maestro/tests/." maestro-debug/ 2>/dev/null || true
          # "App crashed or stopped" is undiagnosable from Maestro alone: a simulator app's
          # crash report lands on the HOST as an .ips file, and an exit without one (a
          # watchdog or jetsam kill) is only named in runningboardd's log.
          mkdir -p maestro-debug/crash-reports
          cp "$HOME"/Library/Logs/DiagnosticReports/Ostomate* maestro-debug/crash-reports/ 2>/dev/null || true
          ls -la maestro-debug/crash-reports
          xcrun simctl spawn "$SIM_UDID" log show --last 60m --style compact \
            --predicate 'process == "Ostomate" OR eventMessage CONTAINS[c] "com.ostomate.app"' \
            > maestro-debug/simulator-app.log 2>&1 || true
          bash scripts/sanitize_artifact_names.sh maestro-debug
      - name: Upload Maestro debug artifacts
        # cancelled() too: a job stopped by timeout-minutes is cancelled, not failed.
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-ios-debug
          path: maestro-debug/
          if-no-files-found: ignore

  dashboard:
    name: Publish QA dashboard
    # Post-merge/dispatch only: regenerates the static dashboard (Unit / Integration /
    # UI / CI-CD) and force-pushes it to the `test-dashboard` branch. Bobby's Raspberry
    # Pi pulls that branch and serves it (scripts/pi/update-dashboard.sh); trend history
    # lives in history.json, so the branch keeps a single commit.
    runs-on: ubuntu-latest
    needs: [detect-changes, android, ios, android-e2e, ios-e2e]
    # Not on a docs-only push: with every test job skipped it would record an empty run
    # in the trend history.
    if: >-
      always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && needs.detect-changes.outputs.code == 'true'
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        # Restores shared/… and composeApp/… JUnit XML + JaCoCo reports in place.
        continue-on-error: true
        with:
          name: junit-results-jvm
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: coverage-report
      - name: Fetch job conclusions
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" > jobs.json
      - name: Carry over trend history
        run: |
          mkdir -p site
          if git ls-remote --exit-code origin test-dashboard >/dev/null 2>&1; then
            git fetch origin test-dashboard --depth 1
            git show origin/test-dashboard:history.json > site/history.json || true
          fi
      - name: Generate dashboard
        run: |
          python3 scripts/generate_test_dashboard.py \
            --repo . --jobs-json jobs.json --output-dir site \
            --sha "$GITHUB_SHA" --branch "$GITHUB_REF_NAME" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Push to test-dashboard branch
        run: |
          cd site
          git init -b test-dashboard
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "dashboard: run $GITHUB_RUN_ID"
          git push --force \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            test-dashboard
