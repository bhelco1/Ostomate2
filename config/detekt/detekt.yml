build:
  maxIssues: 0

config:
  validation: true
  warningsAsErrors: false

complexity:
  CyclomaticComplexMethod:
    # A screen composable branches on its UiState to choose what to show; the decisions
    # themselves live in ViewModels and use cases, which this rule still checks.
    ignoreAnnotated:
      - 'Composable'
  LongMethod:
    threshold: 50
    # A composable's length is its layout tree, not logic. Non-UI functions keep the limit.
    ignoreAnnotated:
      - 'Composable'
  LongParameterList:
    # Composables legitimately take many parameters
    active: false
  TooManyFunctions:
    # Composable files naturally contain many small functions
    active: false

naming:
  FunctionNaming:
    # Allow PascalCase for @Composable functions (Compose convention)
    ignoreAnnotated:
      - 'Composable'
    # detekt's default test excludes plus androidHostTest, the KMP Android plugin's name for
    # host tests, so test names like migrate2To3_addsColumn are allowed there as in commonTest.
    excludes:
      - '**/test/**'
      - '**/androidTest/**'
      - '**/commonTest/**'
      - '**/jvmTest/**'
      - '**/androidUnitTest/**'
      - '**/androidHostTest/**'
      - '**/androidInstrumentedTest/**'
      - '**/jsTest/**'
      - '**/iosTest/**'

style:
  MagicNumber:
    # dp/sp values in Compose UI are acceptable inline literals
    active: false
  MaxLineLength:
    maxLineLength: 120
  WildcardImport:
    active: false
  UnusedImports:
    active: true
  ReturnCount:
    max: 4
