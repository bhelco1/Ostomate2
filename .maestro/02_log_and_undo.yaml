appId: com.ostomate.app
name: "Journey 2: Log + undo"
---
- launchApp:
    clearState: true

# Skip onboarding — clearState resets the onboarding flag.
- tapOn:
    text: "Skip"
    optional: true

# Wait for home screen to load
- extendedWaitUntil:
    visible:
      text: "Ostomate"
    timeout: 5000

# Tap the log button on the first supply card
- tapOn:
    id: "logButton"
    index: 0

# Undo snackbar should appear
- extendedWaitUntil:
    visible:
      text: ".*logged.*"
    timeout: 3000

# Tap Undo. The snackbar is Long (10 s); Maestro's settle wait after the log tap eats
# ~3.5 s, which used to race Short's 4 s auto-dismiss (BUG-11).
- tapOn:
    text: "Undo"

# Verify snackbar gone
- extendedWaitUntil:
    notVisible:
      text: ".*logged.*"
    timeout: 2000

# "Snackbar gone" is also true when it merely timed out, and a timeout clears the pending
# undo without deleting. Prove the event was really removed: History must have no rows.
- tapOn:
    id: "overflowButton"
    index: 0
- tapOn:
    text: "View history"
- extendedWaitUntil:
    visible:
      text: ".*history.*"
    timeout: 3000
- extendedWaitUntil:
    notVisible:
      id: "eventRow"
    timeout: 3000
